<body class="bg-background min-h-screen flex flex-col justify-center items-center px-margin-mobile">
<!-- Main Container -->
<main class="w-full max-w-[400px] bg-surface-container-lowest border border-outline-variant rounded-lg p-6 shadow-sm flex flex-col items-center">
<!-- Brand / Header -->
<div class="mb-8 flex flex-col items-center text-center">
<span class="material-symbols-outlined text-[48px] text-primary mb-2" style="font-variation-settings: 'FILL' 1;">
                shield_lock
            </span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">CNM Lyncore</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Portal de Conformidade Mercosul</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-4">
<!-- Email Input -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface uppercase" for="email">E-mail Corporativo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant bg-surface-bright rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="email" name="email" placeholder="nome@empresa.com.br" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface uppercase" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">key</span>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant bg-surface-bright rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="flex justify-between items-center mt-2">
<div class="flex items-center gap-2">
<input class="w-4 h-4 border-outline-variant text-primary-container rounded-sm focus:ring-primary-container" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="remember">Lembrar-me</label>
</div>
<a class="font-body-sm text-body-sm text-primary-container hover:underline" href="#">Esqueci a senha</a>
</div>
<!-- Submit Button -->
<button class="w-full mt-4 bg-primary-container text-on-primary py-3 rounded-DEFAULT font-label-md text-label-md uppercase tracking-wider hover:bg-primary transition-colors flex justify-center items-center gap-2" type="submit">
                Entrar
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="mt-8 pt-4 border-t border-outline-variant w-full text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant text-xs">
                Acesso restrito. Sujeito a auditoria de conformidade regulatória.
            </p>
</div>
