<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - NCM Compliant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-surface": "#191c1d",
                        "on-tertiary": "#ffffff",
                        "secondary": "#5f5e5e",
                        "on-tertiary-fixed": "#191c1f",
                        "secondary-fixed": "#e5e2e1",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f0f1f2",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-secondary-fixed-variant": "#474746",
                        "surface-container": "#edeeef",
                        "tertiary-container": "#313437",
                        "tertiary-fixed-dim": "#c4c7ca",
                        "secondary-container": "#e2dfde",
                        "primary": "#001e40",
                        "outline": "#737780",
                        "tertiary-fixed": "#e0e2e6",
                        "primary-fixed": "#d5e3ff",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#799dd6",
                        "surface-container-low": "#f3f4f5",
                        "surface-dim": "#d9dadb",
                        "surface-variant": "#e1e3e4",
                        "on-secondary-container": "#636262",
                        "on-primary-fixed": "#001b3c",
                        "on-tertiary-fixed-variant": "#44474a",
                        "primary-fixed-dim": "#a7c8ff",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#999ca0",
                        "surface-bright": "#f8f9fa",
                        "tertiary": "#1b1f22",
                        "background": "#f8f9fa",
                        "surface-container-highest": "#e1e3e4",
                        "outline-variant": "#c3c6d1",
                        "inverse-surface": "#2e3132",
                        "surface": "#f8f9fa",
                        "surface-tint": "#3a5f94",
                        "primary-container": "#003366",
                        "on-primary-fixed-variant": "#1f477b",
                        "inverse-primary": "#a7c8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "container-max": "1280px",
                        "margin-mobile": "16px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "code-ncm": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],

<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Container for centering and structure -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-lg border border-outline-variant p-8 md:p-10 shadow-sm relative overflow-hidden">
<!-- Subtle branding accent line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary-container"></div>
<!-- Header / Logo Area -->
<div class="flex flex-col items-center mb-8">
<!-- Logo Placeholder -->
<div class="w-16 h-16 bg-surface-container flex items-center justify-center rounded-full mb-4 border border-outline-variant">
<span class="material-symbols-outlined text-primary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">
                    shield_person
                </span>
</div>
<h1 class="font-headline-md text-headline-md text-primary-container text-center">NCM Compliant</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Acesse o portal de conformidade</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-6" id="loginForm" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">E-mail Corporativo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                        mail
                    </span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="email" name="email" placeholder="usuario@empresa.com.br" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Senha</label>
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" href="#" id="forgotPasswordLink">Esqueceu sua senha?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                        lock
                    </span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined">
                            visibility
                        </span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-3 px-4 bg-primary-container text-on-primary font-label-md text-label-md uppercase tracking-wider rounded hover:bg-primary transition-colors duration-200 mt-2 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex justify-center items-center gap-2" type="submit">
                Entrar
                <span class="material-symbols-outlined" style="font-size: 18px;">
                    login
                </span>
</button>
</form>
<!-- Recovery View (Hidden by default) -->
<div class="hidden flex-col gap-6 pt-6 border-t border-outline-variant mt-6" id="recoveryView">
<div>
<h2 class="font-headline-sm text-headline-sm text-primary-container mb-2">Recuperar Senha</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Informe seu e-mail para receber as instruções de recuperação de acesso.</p>
</div>
<form action="#" class="flex flex-col gap-4" method="POST">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="recoveryEmail">E-mail Corporativo</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors font-body-md text-body-md text-on-surface" id="recoveryEmail" placeholder="usuario@empresa.com.br" required="" type="email"/>
</div>
<div class="flex gap-3">
<button class="flex-1 py-3 px-4 bg-surface-container-low border border-outline-variant text-on-surface font-label-md text-label-md uppercase rounded hover:bg-surface-container-high transition-colors duration-200 text-center" id="cancelRecoveryBtn" type="button">
                        Cancelar
                    </button>
<button class="flex-1 py-3 px-4 bg-primary-container text-on-primary font-label-md text-label-md uppercase rounded hover:bg-primary transition-colors duration-200 text-center" type="submit">
                        Enviar
                    </button>
</div>
</form>
</div>
</div>
<!-- Background texture/image for visual interest (low contrast) -->
<div class="fixed inset-0 z-[-1] opacity-[0.03] pointer-events-none" data-alt="A highly detailed, subtle background pattern suitable for a corporate login screen. It features an abstract, geometric representation of global trade routes and data grids in a light-mode aesthetic. The design is predominantly white and light gray, with faint, precise technical lines hinting at maritime logistics and regulatory frameworks. The mood is highly professional, clean, and modern." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB4E6UvbMDFUvkV_19Wj5_Z8PSZinemH2C8E7Om1OpWQ4J-YsXSwjCz-utSdSoAJ5G3TapkOuZph7rQhC6f6JwF7YcQaKjuDbkEPQJf8JwRioVNthVEGomJqVFt37s42RjX_fcCKeF63o0pJa67IIXphekGCIDXUe1pMp4jG7Z4VLZgDeSgH7SLkf_Lw3Rxcw57I9ZU9fH6P1YSpPH7oF0uW9-z3lHZJoBibLXdvMdMqb1GcBX2aDLy')">
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleIcon = togglePasswordBtn.querySelector('.material-symbols-outlined');

            const forgotPasswordLink = document.getElementById('forgotPasswordLink');
            const loginForm = document.getElementById('loginForm');
            const recoveryView = document.getElementById('recoveryView');
            const cancelRecoveryBtn = document.getElementById('cancelRecoveryBtn');

            // Toggle Password Visibility
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });

            // Toggle Recovery Flow
            forgotPasswordLink.addEventListener('click', (e) => {
                e.preventDefault();
                // Simple toggle logic for demo purposes
                loginForm.style.opacity = '0.5';
                loginForm.style.pointerEvents = 'none';
                recoveryView.classList.remove('hidden');
                recoveryView.classList.add('flex');
                
                // Animate in
                recoveryView.style.opacity = '0';
                setTimeout(() => {
                    recoveryView.style.transition = 'opacity 0.3s ease';
                    recoveryView.style.opacity = '1';
                }, 10);
            });

            cancelRecoveryBtn.addEventListener('click', () => {
                recoveryView.style.opacity = '0';
                setTimeout(() => {
                    recoveryView.classList.add('hidden');
                    recoveryView.classList.remove('flex');
                    loginForm.style.opacity = '1';
                    loginForm.style.pointerEvents = 'auto';
                }, 300);
            });
        });
    </script>
</body></html>
